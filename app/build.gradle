plugins {
    id 'com.android.application'
}

android {
    namespace 'com.my.jarvis'
    compileSdk 34

    defaultConfig {
        applicationId "com.my.jarvis"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
